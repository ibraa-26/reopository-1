<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المستكشف الصغير - مدعوم ببحث Google الآمن</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
  
  <!-- محرك بحث جوجل الآمن -->
  <script async src="https://cse.google.com/cse.js?cx=c784c1f4adf2040c0"></script>

  <style>
    :root {
      --primary: #2B6CB0;
      --secondary: #FFB300;
      --accent: #48BB78;
      --bg: #F4F8FC;
      --text: #2D3748;
      --admin-bg: #2C3E50;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1.2rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .logo {
      font-size: 1.9rem;
      font-weight: 900;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-age {
      background: #E6FFFA;
      color: #234E52;
      border: 1px solid #B2F5EA;
      padding: 8px 16px;
      border-radius: 25px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .btn-admin {
      background: #EDF2F7;
      border: none;
      padding: 8px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      color: #4A5568;
      transition: all 0.2s;
    }

    .btn-admin:hover {
      background: #E2E8F0;
    }

    /* توسيع المساحة الرئيسية للنتائج لتكون مريحة للقراءة */
    main {
      flex: 1;
      max-width: 1050px;
      width: 94%;
      margin: 2rem auto;
    }

    .hero-section {
      text-align: center;
      margin-bottom: 2rem;
    }

    .hero-title {
      font-size: 2.5rem;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    .hero-subtitle {
      color: #718096;
      font-size: 1.15rem;
    }

    .quick-tags {
      margin: 1.5rem 0;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      align-items: center;
    }

    .tag-btn {
      background: white;
      border: 2px solid #E2E8F0;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary);
      transition: all 0.2s;
    }

    .tag-btn:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    /* حاوية البحث والنتائج الواسعة */
    .search-wrapper {
      background: white;
      padding: 2rem;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      border: 2px solid #EBF8FF;
    }

    /* --- تعديل وتكبير عناصر نتائج جوجل لتناسب الأطفال --- */
    .gsc-control-cse {
      padding: 0 !important;
      background: transparent !important;
      border: none !important;
      font-family: 'Tajawal', sans-serif !important;
    }

    /* شريط البحث */
    .gsc-search-box {
      margin-bottom: 1.5rem !important;
    }

    .gsc-input-box {
      border-radius: 16px !important;
      border: 2px solid #CBD5E0 !important;
      padding: 6px 12px !important;
      height: auto !important;
    }

    .gsc-input {
      font-size: 1.25rem !important;
    }

    .gsc-search-button-v2 {
      background-color: var(--secondary) !important;
      border-radius: 14px !important;
      padding: 12px 24px !important;
      border: none !important;
    }

    /* بطاقة النتيجة الفردية */
    .gsc-webResult.gsc-result {
      background: #FFFFFF !important;
      border-bottom: 2px solid #EDF2F7 !important;
      padding: 18px 10px !important;
      margin-bottom: 12px !important;
      text-align: right !important;
      direction: rtl !important;
    }

    /* عنوان النتيجة المقروء والواضح */
    .gs-title, .gs-title * {
      font-size: 1.35rem !important;
      font-weight: 700 !important;
      color: var(--primary) !important;
      line-height: 1.5 !important;
      text-decoration: none !important;
    }

    .gs-title:hover {
      text-decoration: underline !important;
    }

    /* النص والمقتطف التوضيحي داخل النتيجة */
    .gs-snippet {
      font-size: 1.1rem !important;
      line-height: 1.8 !important;
      color: #4A5568 !important;
      margin-top: 8px !important;
    }

    /* رابط الموقع الأصلي */
    .gs-visibleUrl {
      font-size: 0.95rem !important;
      color: #38A169 !important;
      margin-top: 4px !important;
      font-weight: 600 !important;
    }

    /* تكبير وتوضيح الصور المصغرة بجانب النتائج */
    .gs-image-box {
      margin-left: 16px !important;
    }

    .gs-image-box img {
      border-radius: 12px !important;
      max-width: 110px !important;
      max-height: 110px !important;
    }

    /* لوحة تحكم المسؤول */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .modal-card {
      background: white;
      padding: 2.2rem;
      border-radius: 20px;
      width: 90%;
      max-width: 440px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .form-group {
      margin-bottom: 1.2rem;
      text-align: right;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #CBD5E0;
      font-size: 1rem;
      outline: none;
    }

    .btn-action {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-size: 1.05rem;
      margin-top: 10px;
    }

    .btn-close {
      background: #E2E8F0;
      color: #4A5568;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">🚀 المستكشف الصغير</div>
    <div style="display: flex; align-items: center; gap: 15px;">
      <span class="badge-age" id="ageDisplay">حماية Google SafeSearch ✅</span>
      <button class="btn-admin" onclick="openAdminModal()">🔒 تحكم الوالدين</button>
    </div>
  </header>

  <main>
    <div class="hero-section">
      <h1 class="hero-title">ماذا تحب أن تقرأ وتتعلم اليوم؟ 🌟</h1>
      <p class="hero-subtitle">نتائج واضحة، موثوقة، ومصممة خصيصاً للقراءة الممتعة والمريحة</p>

      <div class="quick-tags">
        <span style="font-weight:700; font-size: 0.95rem; color: #4A5568;">موضوعات رائجة:</span>
        <button class="tag-btn" onclick="triggerGoogleSearch('كوكب الأرض والمجموعة الشمسية')">🌍 كوكب الأرض</button>
        <button class="tag-btn" onclick="triggerGoogleSearch('معلومات مدهشة عن الدلافين')">🐬 الدلافين الذكية</button>
        <button class="tag-btn" onclick="triggerGoogleSearch('كيف تشرق الشمس وتغيب؟')">☀️ الشمس والنهار</button>
        <button class="tag-btn" onclick="triggerGoogleSearch('أكبر ديناصور عاش في التاريخ')">🦖 الديناصورات</button>
      </div>
    </div>

    <!-- حاوية البحث الموسعة -->
    <div class="search-wrapper">
      <div class="gcse-search"></div>
    </div>
  </main>

  <!-- نافذة تسجيل دخول المشرف -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-card">
      <h3 style="margin-bottom:1rem; color:var(--admin-bg);">🔐 دخول ولي الأمر</h3>
      <div class="form-group">
        <label>اسم المستخدم:</label>
        <input type="text" id="adminUser" class="form-control" placeholder="admin">
      </div>
      <div class="form-group">
        <label>كلمة المرور:</label>
        <input type="password" id="adminPass" class="form-control" placeholder="••••">
      </div>
      <button class="btn-action" onclick="submitLogin()">دخول</button>
      <button class="btn-action btn-close" onclick="closeModals()">إلغاء</button>
    </div>
  </div>

  <!-- نافذة إعدادات الأمان -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-card">
      <h3 style="margin-bottom:1rem; color:var(--admin-bg);">⚙️ إعدادات التحكم</h3>
      <div class="form-group">
        <label>تغيير كلمة المرور الخاصة بك:</label>
        <input type="password" id="newPassInput" class="form-control" placeholder="أدخل كلمة مرور جديدة">
      </div>
      <button class="btn-action" onclick="saveSettings()">حفظ التعديل</button>
      <button class="btn-action btn-close" onclick="closeModals()">إغلاق</button>
    </div>
  </div>

  <script>
    let currentAdminPass = localStorage.getItem('parent_pass') || '1234';

    function triggerGoogleSearch(term) {
      const searchBox = document.querySelector('input.gsc-input');
      const searchButton = document.querySelector('button.gsc-search-button');
      if (searchBox && searchButton) {
        searchBox.value = term;
        searchButton.click();
      }
    }

    function openAdminModal() {
      document.getElementById('loginModal').style.display = 'flex';
    }

    function closeModals() {
      document.getElementById('loginModal').style.display = 'none';
      document.getElementById('settingsModal').style.display = 'none';
    }

    function submitLogin() {
      const u = document.getElementById('adminUser').value;
      const p = document.getElementById('adminPass').value;

      if (u === 'admin' && p === currentAdminPass) {
        document.getElementById('loginModal').style.display = 'none';
        document.getElementById('adminUser').value = '';
        document.getElementById('adminPass').value = '';
        document.getElementById('settingsModal').style.display = 'flex';
      } else {
        alert('كلمة المرور غير صحيحة!');
      }
    }

    function saveSettings() {
      const newPass = document.getElementById('newPassInput').value.trim();
      if (newPass) {
        currentAdminPass = newPass;
        localStorage.setItem('parent_pass', currentAdminPass);
      }
      closeModals();
      alert('تم حفظ التعديلات بنجاح!');
    }
  </script>
</body>
</html>

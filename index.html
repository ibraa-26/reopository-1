<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المستكشف الصغير - محرك بحث آمن للأطفال</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4A90E2;
      --secondary: #FFB300;
      --accent: #7ED321;
      --bg: #F0F8FF;
      --text: #2C3E50;
      --admin-bg: #34495E;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-age {
      background: #E8F5E9;
      color: #2E7D32;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .btn-admin {
      background: #ECEFF1;
      border: none;
      padding: 8px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      color: #546E7A;
      transition: all 0.2s;
    }

    .btn-admin:hover {
      background: #CFD8DC;
    }

    main {
      flex: 1;
      max-width: 800px;
      width: 90%;
      margin: 3rem auto;
      text-align: center;
    }

    .hero-title {
      font-size: 2.2rem;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    .hero-subtitle {
      color: #7F8C8D;
      margin-bottom: 2rem;
      font-size: 1.1rem;
    }

    .search-box {
      display: flex;
      gap: 10px;
      background: white;
      padding: 8px;
      border-radius: 50px;
      box-shadow: 0 8px 25px rgba(74, 144, 226, 0.15);
      border: 3px solid #E1F5FE;
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      padding: 12px 20px;
      font-size: 1.2rem;
      border-radius: 50px;
    }

    .search-btn {
      background: var(--secondary);
      color: #fff;
      border: none;
      padding: 0 25px;
      border-radius: 40px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .search-btn:hover {
      transform: scale(1.03);
    }

    .quick-tags {
      margin-top: 1.5rem;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .tag-btn {
      background: white;
      border: 1px solid #D0E4F5;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: 0.2s;
    }

    .tag-btn:hover {
      background: var(--primary);
      color: white;
    }

    .results-area {
      margin-top: 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 15px;
      text-align: right;
    }

    .result-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.04);
      border-right: 6px solid var(--accent);
      animation: fadeIn 0.3s ease;
    }

    .result-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .result-snippet {
      line-height: 1.7;
      color: #4A5568;
    }

    .no-results {
      padding: 30px;
      background: white;
      border-radius: 16px;
      color: #718096;
      font-size: 1.1rem;
    }

    /* Modal / نافذة لوحة تحكم المسؤول */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .modal-card {
      background: white;
      padding: 2rem;
      border-radius: 20px;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .modal-card h3 {
      margin-bottom: 1rem;
      color: var(--admin-bg);
    }

    .form-group {
      margin-bottom: 1rem;
      text-align: right;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #CBD5E0;
      font-size: 1rem;
      outline: none;
    }

    .btn-action {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 10px;
    }

    .btn-close {
      background: #E2E8F0;
      color: #4A5568;
      margin-top: 8px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">🚀 المستكشف الصغير</div>
    <div style="display: flex; align-items: center; gap: 15px;">
      <span class="badge-age" id="ageDisplay">الفئة العمرية: كل الأعمار</span>
      <button class="btn-admin" onclick="openAdminModal()">🔒 تحكم الوالدين</button>
    </div>
  </header>

  <main>
    <h1 class="hero-title">ماذا تريد أن تكتشف اليوم؟ 🌟</h1>
    <p class="hero-subtitle">محرك بحث آمن مليء بالمعلومات الممتعة والمفيدة للأذكياء الصغار</p>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="اكتب سؤالك هنا (مثال: الفضاء، الديناصورات، النحل)..." onkeyup="handleKey(event)">
      <button class="search-btn" onclick="executeSearch()">ابحث</button>
    </div>

    <div class="quick-tags">
      <span style="font-weight:700; font-size: 0.9rem; margin-top: 4px;">اقتراحات سريعة:</span>
      <button class="tag-btn" onclick="quickSearch('القمر')">🌕 القمر</button>
      <button class="tag-btn" onclick="quickSearch('الديناصورات')">🦖 الديناصورات</button>
      <button class="tag-btn" onclick="quickSearch('النحل')">🐝 عسل النحل</button>
      <button class="tag-btn" onclick="quickSearch('المطر')">🌧️ كيف ينزل المطر؟</button>
    </div>

    <div class="results-area" id="resultsArea">
      <!-- النتائج ستظهر هنا تلقائياً -->
    </div>
  </main>

  <!-- نافذة تسجيل دخول المسؤول -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-card">
      <h3>🔐 تسجيل دخول ولي الأمر</h3>
      <p style="color:#718096; font-size:0.85rem; margin-bottom:1rem;">(البيانات الافتراضية: admin / 1234)</p>
      
      <div class="form-group">
        <label>اسم المستخدم:</label>
        <input type="text" id="adminUser" class="form-control" placeholder="admin">
      </div>
      <div class="form-group">
        <label>كلمة المرور:</label>
        <input type="password" id="adminPass" class="form-control" placeholder="••••">
      </div>
      <button class="btn-action" onclick="submitLogin()">دخول</button>
      <button class="btn-action btn-close" onclick="closeModals()">إلغاء</button>
    </div>
  </div>

  <!-- نافذة إعدادات الفلتر لولي الأمر -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-card">
      <h3>⚙️ لوحة تحكم الأمان والعمر</h3>
      
      <div class="form-group">
        <label>تحديد المستوى العمري للطفل:</label>
        <select id="ageFilterSelect" class="form-control">
          <option value="all">كل الأعمار (محتوى شامل وآمن)</option>
          <option value="young">صغار (5 - 8 سنوات) - نصوص مبسطة وقصيرة</option>
          <option value="older">أكبر (9 - 14 سنة) - معلومات وحقائق تفصيلية</option>
        </select>
      </div>

      <div class="form-group">
        <label>تغيير كلمة المرور الخاصة بك:</label>
        <input type="password" id="newPassInput" class="form-control" placeholder="اتركها فارغة إن لم ترغب بالتغيير">
      </div>

      <button class="btn-action" onclick="saveSettings()">حفظ التعديلات</button>
      <button class="btn-action btn-close" onclick="closeModals()">إغلاق</button>
    </div>
  </div>

  <script>
    // 1. قاعدة المعرفة الآمنة المصنفة حسب الفئات العمرية
    const safeDatabase = [
      {
        title: "رحلة إلى القمر 🌕",
        keywords: ["القمر", "فضاء", "كواكب", "نجوم"],
        level: "all",
        text: "القمر يدور حول كوكب الأرض كل 27 يوماً تقريباً، وهو يعكس ضوء الشمس لينير لنا السماء ليلاً!"
      },
      {
        title: "كيف تتكون النجوم في الفضاء؟ ✨",
        keywords: ["فضاء", "كواكب", "النجوم"],
        level: "older",
        text: "النجوم هي كرات ضخمة ومضيئة من الغازات الحارة جداً، وتولد داخل سحب ضخمة في الفضاء تُسمى السدم."
      },
      {
        title: "الديناصورات اللطيفة 🦖",
        keywords: ["ديناصور", "الديناصورات", "حيوانات"],
        level: "young",
        text: "الديناصورات كانت حيوانات ضخمة عاشت على الأرض قبل ملايين السنين، ومنها من كان يأكل أوراق الأشجار الخضراء!"
      },
      {
        title: "انقراض الديناصورات وعصورها 🦕",
        keywords: ["ديناصور", "الديناصورات", "تاريخ"],
        level: "older",
        text: "عاشت الديناصورات في العصور الجيولوجية الثلاثة (الترياسي والجوراسي والطباشيري)، ويعتقد العلماء أن نيزكاً ضخماً ضرب كوكب الأرض وسبب اختفاءها."
      },
      {
        title: "مملكة النحل والعسل 🐝",
        keywords: ["النحل", "عسل", "حشرات", "طبيعة"],
        level: "all",
        text: "يزور النحل آلاف الأزهار يومياً لجمع الرحيق وصنع العسل اللذيذ المفيد لصحة أجسادنا."
      },
      {
        title: "كيف ينزل المطر؟ 🌧️",
        keywords: ["المطر", "سحاب", "ماء", "طقس"],
        level: "all",
        text: "تسخن الشمس مياه البحر، فيتصاعد بخار الماء ليشكل الغيوم في السماء، وحين تبرد الغيوم تسقط القطرات كمطر جميل!"
      }
    ];

    // قائمة الكلمات غير اللائقة الممنوعة كلياً
    const blockedWords = ["عنف", "دم", "سلاح", "موت", "كبار", "حرب"];

    // 2. إعدادات ولي الأمر (المخزنة محلياً)
    let currentAdminPass = localStorage.getItem('parent_pass') || '1234';
    let activeAgeFilter = localStorage.getItem('parent_age') || 'all';

    // تحديث شارة العمر في الواجهة
    function updateAgeBadge() {
      const display = document.getElementById('ageDisplay');
      if (activeAgeFilter === 'young') display.innerText = 'الفئة العمرية: (5 - 8 سنوات)';
      else if (activeAgeFilter === 'older') display.innerText = 'الفئة العمرية: (9 - 14 سنة)';
      else display.innerText = 'الفئة العمرية: كل الأعمار';
    }
    updateAgeBadge();

    // 3. محرك البحث والفلترة
    function executeSearch() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const resultsArea = document.getElementById('resultsArea');
      resultsArea.innerHTML = '';

      if (!query) {
        resultsArea.innerHTML = '<div class="no-results">اكتب كلمة في مربع البحث أعلاه للبدء بالاستكشاف! 🚀</div>';
        return;
      }

      // التحقق من الكلمات المحظورة
      const hasBlocked = blockedWords.some(w => query.includes(w));
      if (hasBlocked) {
        resultsArea.innerHTML = `
          <div class="result-card" style="border-right-color: #E74C3C;">
            <div class="result-title" style="color: #E74C3C;">⚠️ تنبيه لطيف</div>
            <p class="result-snippet">هذا السؤال يحتوي على موضوعات غير مخصصة للأطفال في هذا المستكشف. حاول البحث عن الحيوانات، الفضاء، أو العلوم! 🌿</p>
          </div>
        `;
        return;
      }

      // البحث والتصفية حسب الفئة العمرية
      const filtered = safeDatabase.filter(item => {
        // فلتر الكلمات
        const matchKeyword = item.keywords.some(k => query.includes(k)) || item.title.toLowerCase().includes(query) || item.text.toLowerCase().includes(query);
        if (!matchKeyword) return false;

        // فلتر العمر المحدد من قبل ولي الأمر
        if (activeAgeFilter === 'all') return true;
        return item.level === 'all' || item.level === activeAgeFilter;
      });

      if (filtered.length === 0) {
        resultsArea.innerHTML = `
          <div class="no-results">
            لم نجد معلومات حول "<strong>${query}</strong>" متناسبة مع مستواك العمري الحالي. جرب البحث عن كلمات أخرى مثل: النحل، القمر، الديناصورات! 💡
          </div>
        `;
        return;
      }

      // عرض النتائج الآمنة
      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'result-card';
        card.innerHTML = `
          <div class="result-title">${item.title}</div>
          <div class="result-snippet">${item.text}</div>
        `;
        resultsArea.appendChild(card);
      });
    }

    function handleKey(e) {
      if (e.key === 'Enter') executeSearch();
    }

    function quickSearch(word) {
      document.getElementById('searchInput').value = word;
      executeSearch();
    }

    // 4. إدارة لوحة تحكم المسؤول
    function openAdminModal() {
      document.getElementById('loginModal').style.display = 'flex';
    }

    function closeModals() {
      document.getElementById('loginModal').style.display = 'none';
      document.getElementById('settingsModal').style.display = 'none';
    }

    function submitLogin() {
      const u = document.getElementById('adminUser').value;
      const p = document.getElementById('adminPass').value;

      if (u === 'admin' && p === currentAdminPass) {
        document.getElementById('loginModal').style.display = 'none';
        document.getElementById('adminUser').value = '';
        document.getElementById('adminPass').value = '';
        
        // فتح شاشة الإعدادات
        document.getElementById('ageFilterSelect').value = activeAgeFilter;
        document.getElementById('settingsModal').style.display = 'flex';
      } else {
        alert('بيانات الدخول غير صحيحة!');
      }
    }

    function saveSettings() {
      const newAge = document.getElementById('ageFilterSelect').value;
      const newPass = document.getElementById('newPassInput').value.trim();

      activeAgeFilter = newAge;
      localStorage.setItem('parent_age', activeAgeFilter);

      if (newPass) {
        currentAdminPass = newPass;
        localStorage.setItem('parent_pass', currentAdminPass);
      }

      updateAgeBadge();
      closeModals();
      alert('تم حفظ إعدادات الأمان بنجاح!');
      executeSearch(); // إعادة تطبيق الفلتر على البحث الحالي
    }
  </script>
</body>
</html>

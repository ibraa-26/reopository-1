<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المستكشف الصغير - مدعوم ببحث Google الآمن</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
  
  <!-- سكريبت محرك بحث جوجل الخاص بك -->
  <script async src="https://cse.google.com/cse.js?cx=c784c1f4adf2040c0"></script>

  <style>
    :root {
      --primary: #4A90E2;
      --secondary: #FFB300;
      --accent: #7ED321;
      --bg: #F0F8FF;
      --text: #2C3E50;
      --admin-bg: #34495E;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-age {
      background: #E8F5E9;
      color: #2E7D32;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .btn-admin {
      background: #ECEFF1;
      border: none;
      padding: 8px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      color: #546E7A;
      transition: all 0.2s;
    }

    .btn-admin:hover {
      background: #CFD8DC;
    }

    main {
      flex: 1;
      max-width: 850px;
      width: 92%;
      margin: 2.5rem auto;
      text-align: center;
    }

    .hero-title {
      font-size: 2.3rem;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    .hero-subtitle {
      color: #7F8C8D;
      margin-bottom: 1.8rem;
      font-size: 1.1rem;
    }

    /* منطقة مربع بحث جوجل */
    .search-container {
      background: white;
      padding: 1.2rem;
      border-radius: 25px;
      box-shadow: 0 8px 25px rgba(74, 144, 226, 0.12);
      border: 3px solid #E1F5FE;
      margin-bottom: 1.5rem;
    }

    .quick-tags {
      margin-bottom: 1.5rem;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      align-items: center;
    }

    .tag-btn {
      background: white;
      border: 1px solid #D0E4F5;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 700;
      color: #4A90E2;
      transition: 0.2s;
    }

    .tag-btn:hover {
      background: var(--primary);
      color: white;
    }

    /* تحسين وتنسيق مظهر بحث جوجل ليتناسق مع ألوان الموقع */
    .gsc-control-cse {
      padding: 0 !important;
      border: none !important;
      background-color: transparent !important;
    }

    .gsc-search-button-v2 {
      background-color: var(--secondary) !important;
      border-radius: 12px !important;
      border: none !important;
      padding: 10px 18px !important;
    }

    .gsc-input-box {
      border-radius: 15px !important;
      border: 2px solid #E2E8F0 !important;
      padding: 4px !important;
    }

    /* النوافذ المنبثقة للتحكم */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .modal-card {
      background: white;
      padding: 2rem;
      border-radius: 20px;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .form-group {
      margin-bottom: 1rem;
      text-align: right;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #CBD5E0;
      font-size: 1rem;
      outline: none;
    }

    .btn-action {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 10px;
    }

    .btn-close {
      background: #E2E8F0;
      color: #4A5568;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">🚀 المستكشف الصغير</div>
    <div style="display: flex; align-items: center; gap: 15px;">
      <span class="badge-age" id="ageDisplay">حماية SafeSearch: مفعّلة ✅</span>
      <button class="btn-admin" onclick="openAdminModal()">🔒 تحكم الوالدين</button>
    </div>
  </header>

  <main>
    <h1 class="hero-title">عالم المعرفة الآمن بين يديك 🌟</h1>
    <p class="hero-subtitle">ابحث في الإنترنت بحرية وأمان عبر محرك بحث Google المفلتر للأطفال</p>

    <div class="quick-tags">
      <span style="font-weight:700; font-size: 0.9rem;">اكتشف سريعاً:</span>
      <button class="tag-btn" onclick="triggerGoogleSearch('معلومات عن كوكب المريخ للأطفال')">🪐 المريخ</button>
      <button class="tag-btn" onclick="triggerGoogleSearch('كيف تطير الطائرة ببساطة')">✈️ كيف تطير الطائرة؟</button>
      <button class="tag-btn" onclick="triggerGoogleSearch('عجائب عالم البحار والأسماك')">🐬 عالم البحار</button>
      <button class="tag-btn" onclick="triggerGoogleSearch('أسرار الأهرامات للأطفال')">🏛️ الأهرامات</button>
    </div>

    <!-- حاوية محرك بحث جوجل الرسمي -->
    <div class="search-container">
      <div class="gcse-search"></div>
    </div>
  </main>

  <!-- نافذة تسجيل دخول ولي الأمر -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-card">
      <h3>🔐 تسجيل دخول ولي الأمر</h3>
      <p style="color:#718096; font-size:0.85rem; margin-bottom:1rem;">(البيانات الافتراضية: admin / 1234)</p>
      
      <div class="form-group">
        <label>اسم المستخدم:</label>
        <input type="text" id="adminUser" class="form-control" placeholder="admin">
      </div>
      <div class="form-group">
        <label>كلمة المرور:</label>
        <input type="password" id="adminPass" class="form-control" placeholder="••••">
      </div>
      <button class="btn-action" onclick="submitLogin()">دخول</button>
      <button class="btn-action btn-close" onclick="closeModals()">إلغاء</button>
    </div>
  </div>

  <!-- نافذة إعدادات الأمان -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-card">
      <h3>⚙️ لوحة تحكم الوالدين</h3>
      
      <div class="form-group">
        <label>مستوى أمان البحث:</label>
        <select class="form-control" disabled>
          <option selected>SafeSearch الصارم (مُفعل من جوجل تلقائياً)</option>
        </select>
      </div>

      <div class="form-group">
        <label>تغيير كلمة مرور المشرف:</label>
        <input type="password" id="newPassInput" class="form-control" placeholder="اكتب كلمة مرور جديدة">
      </div>

      <button class="btn-action" onclick="saveSettings()">حفظ التعديلات</button>
      <button class="btn-action btn-close" onclick="closeModals()">إغلاق</button>
    </div>
  </div>

  <script>
    let currentAdminPass = localStorage.getItem('parent_pass') || '1234';

    // البحث السريع عند الضغط على الأزرار المقترحة
    function triggerGoogleSearch(term) {
      const searchBox = document.querySelector('input.gsc-input');
      const searchButton = document.querySelector('button.gsc-search-button');
      
      if (searchBox && searchButton) {
        searchBox.value = term;
        searchButton.click();
      }
    }

    // إدارة نوافذ ولي الأمر
    function openAdminModal() {
      document.getElementById('loginModal').style.display = 'flex';
    }

    function closeModals() {
      document.getElementById('loginModal').style.display = 'none';
      document.getElementById('settingsModal').style.display = 'none';
    }

    function submitLogin() {
      const u = document.getElementById('adminUser').value;
      const p = document.getElementById('adminPass').value;

      if (u === 'admin' && p === currentAdminPass) {
        document.getElementById('loginModal').style.display = 'none';
        document.getElementById('adminUser').value = '';
        document.getElementById('adminPass').value = '';
        document.getElementById('settingsModal').style.display = 'flex';
      } else {
        alert('كلمة المرور أو اسم المستخدم غير صحيح!');
      }
    }

    function saveSettings() {
      const newPass = document.getElementById('newPassInput').value.trim();
      if (newPass) {
        currentAdminPass = newPass;
        localStorage.setItem('parent_pass', currentAdminPass);
      }
      closeModals();
      alert('تم حفظ التعديلات بنجاح!');
    }
  </script>
</body>
</html>
